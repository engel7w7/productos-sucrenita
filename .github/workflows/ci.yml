name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Validar Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?pgbouncer=true"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar esquema de Prisma
        run: npx prisma validate

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Compilar TypeScript
        run: npm run build

  test-frontend:
    name: Validar Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar Build y Tipos
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://sucrenita-api.onrender.com
