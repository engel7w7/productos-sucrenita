      <path d="M 0,-50 C 15,-40 15,-20 0,-10 C -15,-20 -15,-40 0,-50 Z" fill="none" stroke="#A86F28" stroke-width="2" stroke-dasharray="3 3" />
      <path d="M 0,10 C 18,20 18,50 0,65 C -18,50 -18,20 0,10 Z" fill="none" stroke="#A86F28" stroke-width="2" stroke-dasharray="3 3" />
      <circle cx="-12" cy="-35" r="3" fill="#8C531B" opacity="0.4" />
      <circle cx="10" cy="-25" r="3" fill="#8C531B" opacity="0.4" />
      <circle cx="-10" cy="35" r="3.5" fill="#8C531B" opacity="0.4" />
      <circle cx="12" cy="45" r="3" fill="#8C531B" opacity="0.4" />
    </g>

    <g transform="translate(45, -10) rotate(22) scale(1.1)">
      <path d="M 0,-85 C 22,-85 28,-75 22,-60 C 35,-10 40,40 15,95 C 0,120 -15,115 -18,90 C -25,45 -22,-10 -15,-60 C -20,-75 -15,-85 0,-85 Z" 
            fill="url(#chiliGradient)" stroke="#520B04" stroke-width="4" />
      <path d="M -3,-60 C 10,-5 15,35 2,75" fill="none" stroke="#FFA399" stroke-width="5" stroke-linecap="round" opacity="0.45" />
      <path d="M 0,-85 C -2,-105 10,-115 15,-120 C 12,-112 8,-105 5,-90" fill="none" stroke="url(#greenGradient)" stroke-width="6" stroke-linecap="round" />
      <path d="M -15,-72 C -8,-68 8,-68 15,-72 C 12,-64 -12,-64 -15,-72 Z" fill="url(#greenGradient)" stroke="#1E4D2B" stroke-width="2" />
    </g>

    <g transform="translate(0, 105)">
