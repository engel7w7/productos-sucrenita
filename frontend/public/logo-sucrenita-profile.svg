<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="65%" stop-color="#FBF4EA" />
      <stop offset="100%" stop-color="#F3E5D3" />
    </radialGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A638" />
      <stop offset="50%" stop-color="#C6821A" />
      <stop offset="100%" stop-color="#9E6108" />
    </linearGradient>

    <linearGradient id="chiliGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D94132" />
      <stop offset="60%" stop-color="#B32415" />
      <stop offset="100%" stop-color="#7A1208" />
    </linearGradient>

    <linearGradient id="peanutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D19D" />
      <stop offset="50%" stop-color="#DDAA63" />
      <stop offset="100%" stop-color="#B87E35" />
    </linearGradient>

    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9F6E" />
      <stop offset="100%" stop-color="#245F3B" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5A3A1A" flood-opacity="0.18" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3E26" flood-opacity="0.25" />
    </filter>

    <path id="archTop" d="M 210,540 A 330,330 0 0,1 870,540" fill="none" />
    <path id="archBottom" d="M 870,540 A 330,330 0 0,1 210,540" fill="none" />
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGradient)" />

  <g filter="url(#softShadow)">
    <circle cx="540" cy="540" r="490" fill="#FFFDF9" stroke="#E2C9AC" stroke-width="4" />
    <circle cx="540" cy="540" r="468" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-dasharray="8 6" />
    <circle cx="540" cy="540" r="448" fill="#FFFBF5" stroke="#9E6108" stroke-width="3" />
  </g>

  <circle cx="540" cy="540" r="360" fill="#FAF1E4" stroke="#DDB88C" stroke-width="2" />

  <text font-family="'Playfair Display', Georgia, serif" font-size="62" font-weight="900" fill="#4A260D" letter-spacing="9">
