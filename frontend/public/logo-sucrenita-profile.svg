      <path d="M -160,0 L 160,0 L 145,36 L -145,36 Z" fill="url(#goldGradient)" stroke="#704303" stroke-width="2" />
      <text y="24" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
