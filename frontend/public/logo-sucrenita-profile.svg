    <rect x="-234" y="-36" width="468" height="72" rx="36" fill="url(#greenGradient)" />

    <g transform="translate(-175, -2)">
      <circle cx="0" cy="0" r="22" fill="#25D366" />
      <path d="M -10,-10 C -15,-5 -15,5 -10,10 C -5,15 5,15 10,10 C 15,5 15,-5 10,-10 C 5,-15 -5,-15 -10,-10 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M -5,-3 C -4,-6 -2,-6 -1,-4 C 1,-2 2,1 1,3 C -1,5 -3,4 -5,-3 Z" fill="#FFFFFF" />
    </g>

    <text x="25" y="-5" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#D4F5DE" text-anchor="middle" letter-spacing="2">
      PEDIDOS &amp; ATENCIÓN DIRECTA
    </text>
    <text x="25" y="24" font-family="'Inter', Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      +591 71152182
    </text>
