    <circle cx="0" cy="0" r="218" fill="none" stroke="#DDAA63" stroke-width="1.5" stroke-dasharray="4 4" />

    <g opacity="0.85">
      <path d="M -160,80 C -180,0 -120,-80 -60,-120" fill="none" stroke="#DDAA63" stroke-width="4" stroke-linecap="round" />
      <path d="M -150,50 C -140,40 -120,40 -115,55" fill="none" stroke="#DDAA63" stroke-width="3" />
      <path d="M -140,-10 C -130,-20 -110,-20 -105,-5" fill="none" stroke="#DDAA63" stroke-width="3" />
      <path d="M -110,-60 C -100,-70 -80,-70 -75,-55" fill="none" stroke="#DDAA63" stroke-width="3" />

      <path d="M 160,80 C 180,0 120,-80 60,-120" fill="none" stroke="#DDAA63" stroke-width="4" stroke-linecap="round" />
      <path d="M 150,50 C 140,40 120,40 115,55" fill="none" stroke="#DDAA63" stroke-width="3" />
      <path d="M 140,-10 C 130,-20 110,-20 105,-5" fill="none" stroke="#DDAA63" stroke-width="3" />
      <path d="M 110,-60 C 100,-70 80,-70 75,-55" fill="none" stroke="#DDAA63" stroke-width="3" />
