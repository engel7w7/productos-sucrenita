databases:
  - name: sucrenita-db
    databaseName: sucrenita
    user: postgres
    plan: free

services:
  - type: web
    name: sucrenita-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sucrenita-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  - type: web
    name: sucrenita-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://sucrenita-api.onrender.com
      - key: PORT
        value: 3000
