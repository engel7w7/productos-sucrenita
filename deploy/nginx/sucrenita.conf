# Configuracion Nginx para Productos Sucrenita con SSL/TLS
# Valido para Let's Encrypt (Certbot), ZeroSSL y Certificados Autofirmados

# Redireccion de trafico HTTP (puerto 80) hacia HTTPS (puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name sucrenita.dominio.bo productos-sucrenita.bo www.productos-sucrenita.bo;

    # Validacion HTTP-01 de Let's Encrypt y ZeroSSL (ACME Challenge)
    # Permite a la entidad certificadora validar la posesion del dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redireccionar el resto del trafico a HTTPS permanente
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor seguro HTTPS (puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sucrenita.dominio.bo productos-sucrenita.bo www.productos-sucrenita.bo;

    # =========================================================================
    # OPCIONES DE CERTIFICADOS SSL (Descomenta la que corresponda a tu entorno):
    # =========================================================================

    # OPCION 1: Let's Encrypt (Generado automaticamente con Certbot)
    ssl_certificate /etc/letsencrypt/live/productos-sucrenita.bo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/productos-sucrenita.bo/privkey.pem;

    # OPCION 2: ZeroSSL (Certificados descargados desde ZeroSSL.com)
    # Se recomienda concatenar: cat certificate.crt ca_bundle.crt > /etc/ssl/zerossl/fullchain.crt
    # ssl_certificate /etc/ssl/zerossl/fullchain.crt;
    # ssl_certificate_key /etc/ssl/zerossl/private.key;

    # OPCION 3: Certificado Autofirmado (Para pruebas en VPS o desarrollo)
    # ssl_certificate /etc/ssl/selfsigned/server.crt;
    # ssl_certificate_key /etc/ssl/selfsigned/server.key;

    # =========================================================================
    # PARAMETROS DE SEGURIDAD SSL/TLS (Mejores practicas A+)
    # =========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras de Seguridad y HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================================
    # ENRUTAMIENTO DE SERVICIOS
    # =========================================================================

    # 1. API Backend (Node.js + Express en puerto 10000)
    location /api/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Endpoint de salud de la API
    location /health {
        proxy_pass http://127.0.0.1:10000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Frontend Web (Next.js en puerto 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
